  "components": {
    "securitySchemes": {
      "oauth2": {
        "type": "oauth2",
        "flows": {
          "authorizationCode": {
            "authorizationUrl": "http://localhost:8080/realms/quizarena/protocol/openid-connect/auth",
            "tokenUrl": "http://localhost:8080/realms/quizarena/protocol/openid-connect/token",
            "scopes": {
              "matches.read": "matches.read",
              "matches.write": "matches.write"
            }
          },
          "clientCredentials": {
            "tokenUrl": "http://localhost:8080/realms/quizarena/protocol/openid-connect/token",
            "scopes": {}
          }
        }
      }
    },
    "schemas": {
      "Problem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "type",
          "title",
          "status",
          "detail",
          "traceId"
        ],
        "properties": {
          "type": {
            "type": "string",
            "format": "uri"
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200,
            "pattern": "\\S"
          },
          "status": {
            "type": "integer",
            "minimum": 400,
            "maximum": 599
          },
          "detail": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1000,
            "pattern": "\\S"
          },
          "traceId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100,
            "pattern": "\\S"
          }
        }
      },
      "Health": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok"
            ]
          }
        }
      },
      "Subject": {
        "type": "string",
        "minLength": 1,
        "maxLength": 200,
        "pattern": "\\S"
      },
      "MatchId": {
        "type": "string",
        "minLength": 1,
        "maxLength": 100,
        "pattern": "\\S"
      },
      "JoinCode": {
        "type": "string",
        "pattern": "^[A-Z0-9]{6}$",
        "minLength": 6,
        "maxLength": 6
      },
      "CreateMatch": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "joinCode"
        ],
        "properties": {
          "joinCode": {
            "$ref": "#/components/schemas/JoinCode"
          }
        }
      },
      "Match": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "matchId",
          "playerAId",
          "playerBId",
          "status",
          "playerAScore",
          "playerBScore",
          "currentQuestionIndex",
          "winnerUserId",
          "draw",
          "completedAt"
        ],
        "properties": {
          "matchId": {
            "$ref": "#/components/schemas/MatchId"
          },
          "playerAId": {
            "$ref": "#/components/schemas/Subject"
          },
          "playerBId": {
            "$ref": "#/components/schemas/Subject"
          },
          "status": {
            "type": "string",
            "enum": [
              "ACTIVE",
