  "components": {
    "securitySchemes": {
      "oauth2": {
        "type": "oauth2",
        "flows": {
          "authorizationCode": {
            "authorizationUrl": "http://localhost:8080/realms/quizarena/protocol/openid-connect/auth",
            "tokenUrl": "http://localhost:8080/realms/quizarena/protocol/openid-connect/token",
            "scopes": {
              "events.read": "events.read",
              "preferences.read": "preferences.read",
              "preferences.write": "preferences.write"
            }
          },
          "clientCredentials": {
            "tokenUrl": "http://localhost:8080/realms/quizarena/protocol/openid-connect/token",
            "scopes": {
              "events.write": "events.write"
            }
          }
        }
      }
    },
    "schemas": {
      "Problem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "type",
          "title",
          "status",
          "detail",
          "traceId"
        ],
        "properties": {
          "type": {
            "type": "string",
            "format": "uri"
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200,
            "pattern": "\\S"
          },
          "status": {
            "type": "integer",
            "minimum": 400,
            "maximum": 599
          },
          "detail": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1000,
            "pattern": "\\S"
          },
          "traceId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100,
            "pattern": "\\S"
          }
        }
      },
      "Health": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok"
            ]
          }
        }
      },
      "Subject": {
        "type": "string",
        "minLength": 1,
        "maxLength": 200,
        "pattern": "\\S"
      },
      "MatchId": {
        "type": "string",
        "minLength": 1,
        "maxLength": 100,
        "pattern": "\\S"
      },
      "JoinCode": {
        "type": "string",
        "pattern": "^[A-Z0-9]{6}$",
        "minLength": 6,
        "maxLength": 6
      },
      "CreateEvent": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "eventId",
          "type",
          "userId",
          "payload"
        ],
        "properties": {
          "eventId": {
            "type": "string",
            "format": "uuid"
          },
          "type": {
            "type": "string",
            "enum": [
              "MATCH_CREATED",
              "MATCH_COMPLETED"
            ]
          },
          "userId": {
            "$ref": "#/components/schemas/Subject"
          },
          "payload": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "matchId"
            ],
            "properties": {
              "matchId": {
                "$ref": "#/components/schemas/MatchId"
              },
              "winnerUserId": {
                "type": "string",
                "minLength": 1,
                "maxLength": 200,
                "pattern": "\\S",
                "nullable": true
              },
              "draw": {
                "type": "boolean"
              }
            }
          }
        }
      },
      "Event": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "eventId",
          "type",
          "userId",
          "payload",
          "createdAt"
        ],
        "properties": {
          "eventId": {
            "type": "string",
            "format": "uuid"
          },
          "type": {
            "type": "string",
            "enum": [
              "MATCH_CREATED",
              "MATCH_COMPLETED"
            ]
          },
          "userId": {
            "$ref": "#/components/schemas/Subject"
          },
          "payload": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "matchId"
            ],
            "properties": {
              "matchId": {
                "$ref": "#/components/schemas/MatchId"
              },
              "winnerUserId": {
                "type": "string",
                "minLength": 1,
                "maxLength": 200,
                "pattern": "\\S",
                "nullable": true
              },
              "draw": {
                "type": "boolean"
              }
            }
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Preferences": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "userId",
          "emailEnabled",
          "pushEnabled"
        ],
        "properties": {
          "userId": {
            "$ref": "#/components/schemas/Subject"
          },
          "emailEnabled": {
            "type": "boolean"
          },
          "pushEnabled": {
            "type": "boolean"
          }
        }
      },
      "UpdatePreferences": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "emailEnabled",
          "pushEnabled"
        ],
        "properties": {
          "emailEnabled": {
            "type": "boolean"
          },
          "pushEnabled": {
            "type": "boolean"
          }
        }
      }
    }
  }
}
