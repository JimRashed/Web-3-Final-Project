    "title": "QuizArena notification API — proposed P02",
    "version": "1.0.0",
    "description": "Proposed contract pending final team review. Existing application does not yet implement this service. See docs/milestone3/api-contracts.md. JSON-compatible YAML; no credentials in examples."
  },
  "servers": [
    {
      "url": "http://localhost:5106",
      "description": "Development only; configure HTTPS for deployments"
    }
  ],
