  "paths": {
    "/events": {
      "post": {
        "operationId": "createEvent",
        "tags": [
          "notification"
        ],
        "summary": "createEvent",
        "description": "Persist before202. EventId unique within issuer; same immutable payload replay returns original Event including createdAt; conflict409. Typed payload invariants in api-contracts.md are required.",
        "security": [
          {
            "oauth2": [
              "events.write"
            ]
          }
        ],
        "x-policy": "events.write",
        "x-actor": "machine",
        "x-audience": "quizarena-notification",
        "x-ownership": "none",
        "parameters": [],
        "responses": {
          "202": {
            "description": "Persisted event accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Event"
                },
                "example": {
                  "eventId": "26c94137-d660-4397-a731-050c2bb07004",
                  "type": "MATCH_COMPLETED",
                  "userId": "player-a",
                  "payload": {
                    "matchId": "26c94137-d660-4397-a731-050c2bb07001",
                    "winnerUserId": "player-a",
                    "draw": false
                  },
                  "createdAt": "2026-11-03T12:00:00Z"
                }
              }
            }
          },
          "400": {
            "description": "Invalid input",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                },
                "example": {
                  "type": "https://example.invalid/problems/400",
                  "title": "Invalid input",
                  "status": 400,
                  "detail": "Invalid input",
                  "traceId": "example-trace"
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid bearer token",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                },
                "example": {
                  "type": "https://example.invalid/problems/401",
                  "title": "Missing or invalid bearer token",
                  "status": 401,
                  "detail": "Missing or invalid bearer token",
                  "traceId": "example-trace"
                }
              }
            },
            "headers": {
              "WWW-Authenticate": {
                "schema": {
                  "type": "string"
                },
                "example": "Bearer",
                "description": "Bearer authentication challenge"
              }
            }
          },
          "403": {
            "description": "Insufficient scope, actor kind or ownership",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                },
                "example": {
                  "type": "https://example.invalid/problems/403",
                  "title": "Insufficient scope, actor kind or ownership",
                  "status": 403,
                  "detail": "Insufficient scope, actor kind or ownership",
                  "traceId": "example-trace"
                }
              }
            }
          },
          "409": {
            "description": "Conflicting duplicate or state",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                },
                "example": {
                  "type": "https://example.invalid/problems/409",
                  "title": "Conflicting duplicate or state",
                  "status": 409,
                  "detail": "Conflicting duplicate or state",
                  "traceId": "example-trace"
                }
              }
            }
          },
          "500": {
            "description": "Unexpected failure; safe response",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                },
                "example": {
                  "type": "https://example.invalid/problems/500",
                  "title": "Unexpected failure; safe response",
                  "status": 500,
                  "detail": "Unexpected failure; safe response",
                  "traceId": "example-trace"
                }
              }
            }
          },
          "503": {
            "description": "Dependency unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                },
                "example": {
                  "type": "https://example.invalid/problems/503",
                  "title": "Dependency unavailable",
                  "status": 503,
                  "detail": "Dependency unavailable",
                  "traceId": "example-trace"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/CreateEvent"
              },
              "example": {
                "eventId": "26c94137-d660-4397-a731-050c2bb07004",
                "type": "MATCH_COMPLETED",
                "userId": "player-a",
                "payload": {
                  "matchId": "26c94137-d660-4397-a731-050c2bb07001",
                  "winnerUserId": "player-a",
                  "draw": false
                }
              }
            }
          }
        }
      },
