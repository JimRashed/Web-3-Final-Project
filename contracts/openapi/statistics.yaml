{
  "openapi": "3.0.3",
  "info": {
    "title": "QuizArena statistics API — proposed P02",
    "version": "1.0.0",
    "description": "Proposed contract pending final team review. Existing application does not yet implement this service. See docs/milestone3/api-contracts.md. JSON-compatible YAML; no credentials in examples."
  },
  "servers": [
    {
      "url": "http://localhost:5102",
      "description": "Development only; configure HTTPS for deployments"
    }
  ],
  "tags": [
    {
      "name": "statistics"
    }
  ],
  "paths": {
    "/api/results": {
      "post": {
        "operationId": "recordResult",
        "tags": [
          "statistics"
        ],
        "summary": "recordResult",
        "description": "200 empty on initial insert and semantically identical replay. Unique (issuer,matchId,userId); different immutable content409. Caller is allowlisted Gameplay machine.",
        "security": [
          {
            "oauth2": [
              "results.write"
            ]
          }
        ],
        "x-policy": "results.write",
        "x-actor": "machine",
        "x-audience": "quizarena-statistics",
        "x-ownership": "none",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Success"
          },
          "400": {
            "description": "Invalid input",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                },
                "example": {
                  "type": "https://example.invalid/problems/400",
                  "title": "Invalid input",
                  "status": 400,
                  "detail": "Invalid input",
                  "traceId": "example-trace"
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid bearer token",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                },
                "example": {
                  "type": "https://example.invalid/problems/401",
                  "title": "Missing or invalid bearer token",
                  "status": 401,
                  "detail": "Missing or invalid bearer token",
                  "traceId": "example-trace"
                }
              }
            },
            "headers": {
              "WWW-Authenticate": {
                "schema": {
                  "type": "string"
                },
                "example": "Bearer",
                "description": "Bearer authentication challenge"
              }
            }
          },
          "403": {
            "description": "Insufficient scope, actor kind or ownership",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                },
                "example": {
                  "type": "https://example.invalid/problems/403",
                  "title": "Insufficient scope, actor kind or ownership",
                  "status": 403,
                  "detail": "Insufficient scope, actor kind or ownership",
                  "traceId": "example-trace"
                }
              }
            }
          },
          "409": {
            "description": "Conflicting duplicate or state",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                },
                "example": {
                  "type": "https://example.invalid/problems/409",
                  "title": "Conflicting duplicate or state",
                  "status": 409,
                  "detail": "Conflicting duplicate or state",
                  "traceId": "example-trace"
                }
              }
            }
          },
          "500": {
            "description": "Unexpected failure; safe response",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                },
                "example": {
                  "type": "https://example.invalid/problems/500",
                  "title": "Unexpected failure; safe response",
                  "status": 500,
                  "detail": "Unexpected failure; safe response",
                  "traceId": "example-trace"
                }
              }
            }
          },
          "503": {
            "description": "Dependency unavailable",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                },
                "example": {
                  "type": "https://example.invalid/problems/503",
                  "title": "Dependency unavailable",
                  "status": 503,
                  "detail": "Dependency unavailable",
                  "traceId": "example-trace"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/RecordResult"
              },
              "example": {
                "matchId": "26c94137-d660-4397-a731-050c2bb07001",
                "userId": "player-a",
                "score": 3,
                "won": true,
                "playedAt": "2026-11-03T12:00:00Z"
              }
            }
          }
        }
      }
    },
