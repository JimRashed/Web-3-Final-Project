    "/health": {
      "get": {
        "operationId": "statisticsHealth",
        "tags": [
          "statistics"
        ],
        "summary": "statisticsHealth",
        "description": "Liveness only; no credentials, topology, connection strings or dependency details.",
        "security": [],
        "x-policy": "public",
        "x-actor": "public",
        "x-audience": null,
        "x-ownership": "none",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
