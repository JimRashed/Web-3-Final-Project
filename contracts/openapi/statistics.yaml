  "components": {
    "securitySchemes": {
      "oauth2": {
        "type": "oauth2",
        "flows": {
          "authorizationCode": {
            "authorizationUrl": "http://localhost:8080/realms/quizarena/protocol/openid-connect/auth",
            "tokenUrl": "http://localhost:8080/realms/quizarena/protocol/openid-connect/token",
            "scopes": {
              "stats.read": "stats.read",
              "leaderboard.read": "leaderboard.read"
            }
          },
          "clientCredentials": {
            "tokenUrl": "http://localhost:8080/realms/quizarena/protocol/openid-connect/token",
            "scopes": {
              "results.write": "results.write"
            }
          }
        }
      }
    },
    "schemas": {
      "Problem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "type",
          "title",
          "status",
          "detail",
          "traceId"
        ],
        "properties": {
          "type": {
            "type": "string",
            "format": "uri"
          },
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200,
            "pattern": "\\S"
          },
          "status": {
            "type": "integer",
            "minimum": 400,
            "maximum": 599
          },
          "detail": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1000,
            "pattern": "\\S"
          },
          "traceId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100,
            "pattern": "\\S"
          }
        }
      },
      "Health": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok"
            ]
          }
        }
      },
      "Subject": {
        "type": "string",
        "minLength": 1,
        "maxLength": 200,
        "pattern": "\\S"
      },
      "MatchId": {
        "type": "string",
        "minLength": 1,
        "maxLength": 100,
        "pattern": "\\S"
      },
      "JoinCode": {
        "type": "string",
        "pattern": "^[A-Z0-9]{6}$",
        "minLength": 6,
        "maxLength": 6
      },
      "RecordResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "matchId",
          "userId",
          "score",
          "won",
          "playedAt"
        ],
        "properties": {
          "matchId": {
            "$ref": "#/components/schemas/MatchId"
          },
          "userId": {
            "$ref": "#/components/schemas/Subject"
          },
          "score": {
            "type": "integer",
            "minimum": 0,
            "maximum": 5
          },
          "won": {
            "type": "boolean"
          },
          "playedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Stats": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "userId",
          "gamesPlayed",
          "wins",
          "totalScore"
        ],
        "properties": {
          "userId": {
            "$ref": "#/components/schemas/Subject"
          },
          "gamesPlayed": {
            "type": "integer",
            "minimum": 0
          },
          "wins": {
            "type": "integer",
            "minimum": 0
          },
          "totalScore": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "History": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "matchId",
          "score",
          "won",
          "playedAt"
        ],
        "properties": {
          "matchId": {
            "$ref": "#/components/schemas/MatchId"
          },
          "score": {
            "type": "integer",
            "minimum": 0
          },
          "won": {
            "type": "boolean"
          },
          "playedAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Leader": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "userId",
          "totalScore",
          "wins"
        ],
        "properties": {
          "userId": {
            "$ref": "#/components/schemas/Subject"
          },
          "totalScore": {
            "type": "integer",
            "minimum": 0
          },
          "wins": {
            "type": "integer",
            "minimum": 0
          }
        }
      }
    }
  }
}
